name: Docker Build and Deploy

on:
  push:
    branches:
      - stageIQ/fixes
  workflow_dispatch:
  


jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      REPO_NAME: ${{ github.event.repository.name }}
      OWNER: ${{ github.repository_owner }}
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase owner
        run: echo "OWNER_LC=$(echo $OWNER | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set image name
        run: echo "IMAGE_NAME=ghcr.io/$OWNER_LC/$REPO_NAME" >> $GITHUB_ENV
        
       # Log in to GitHub Container Registry
      - name: Log in to GHCR
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.all-in-one
          push: true
          tags: $IMAGE_NAME:staging-${{ github.sha }}:latest 

  deploy-droplet1:
    needs: build-and-push
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy to Digital Ocean Droplet 1
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DO_HOST }}
          username: root
          key: ${{ secrets.DO_SSH_KEYS }}
          script: |
            cd /root/HiEvents
            # Login to GitHub Container Registry
            echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Pull the latest image
            docker pull $IMAGE_NAME:staging-${{ github.sha }}:latest
            
            # Stop and remove existing containers
            docker compose -f docker/all-in-one/docker-compose.yml down
            
            # Prune unused images
            docker image prune -f
            
            # Start with new image
            docker compose -f docker/all-in-one/docker-compose.yml up -d --build

  deploy-droplet2:
    needs: build-and-push
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy to Digital Ocean Droplet 2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DROPLET_HOST_2 }}
          username: root
          key: ${{ secrets.DO_SSH_KEYS }}
          script: |
            cd /root/HiEvents
            # Login to GitHub Container Regist
            echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Pull the latest image
            docker pull $IMAGE_NAME:staging-${{ github.sha }}:latest
            
            # Stop and remove existing containers
            docker compose -f docker/all-in-one/docker-compose.yml down
            
            # Prune unused images
            docker image prune -f
            
            # Start with new image
            docker compose -f docker/all-in-one/docker-compose.yml up -d --build
